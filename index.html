    <style>
        /* ==========================================================================
           CSS VARIABLES & RESET (FRESH COLORS, NO BLACK)
           ========================================================================== */
        :root {
            /* Core Colors - No black used */
            --bg-color: #f0fdf4; /* Fresh minty white */
            --surface-color: #ffffff;
            --text-main: #1e3a5f; /* Deep navy blue instead of black */
            --text-light: #476a94;
            --border-color: #d1e5f0;
            
            /* Sport Accent Colors */
            --accent-primary: #0ea5e9; /* Light Blue */
            --accent-football: #10b981; /* Fresh Green */
            --accent-f1: #ef4444; /* Red */
            --accent-basketball: #f97316; /* Orange */
            --accent-tennis: #84cc16; /* Lime */
            
            /* UI Settings */
            --shadow-sm: 0 4px 6px -1px rgba(30, 58, 95, 0.1);
            --shadow-lg: 0 10px 25px -3px rgba(30, 58, 95, 0.15);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        button { border: none; cursor: pointer; font-family: inherit; transition: var(--transition); }

        /* ==========================================================================
           ANIMATIONS
           ========================================================================== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes heroZoom {
            from { transform: scale(1.05); }
            to { transform: scale(1); }
        }

        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
        .animate-slide { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        
        /* Staggered animation delays */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* ==========================================================================
           LAYOUT & COMPONENTS
           ========================================================================== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER */
        header {
            background-color: var(--surface-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .brand span {
            color: var(--accent-primary);
        }

        .main-nav {
            display: flex;
            gap: 20px;
        }

        .main-nav a {
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 14px;
        }

        .main-nav a:hover, .main-nav a.active {
            color: var(--accent-primary);
        }

        .lang-selector select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            height: 60vh;
            min-height: 400px;
            background: linear-gradient(135deg, var(--text-main), var(--accent-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&q=80&w=2000') center/cover;
            opacity: 0.2;
            animation: heroZoom 10s infinite alternate;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 20px;
        }

        .hero h1 { font-size: 3.5rem; margin-bottom: 20px; line-height: 1.2; }
        .hero p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 30px; }

        /* GRID & CARDS */
        .section-title {
            font-size: 2rem;
            margin: 60px 0 30px;
            color: var(--text-main);
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 50%; height: 4px;
            background-color: var(--accent-primary);
            border-radius: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background: var(--surface-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
        }

        .card-img {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .sport-badge {
            position: absolute;
            top: 15px; left: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        .badge-football { background-color: var(--accent-football); }
        .badge-f1 { background-color: var(--accent-f1); }
        .badge-basketball { background-color: var(--accent-basketball); }
        .badge-tennis { background-color: var(--accent-tennis); }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        /* ARTICLE PAGE */
        .article-header {
            margin-top: 40px;
            text-align: center;
        }
        
        .article-sport-tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            margin-bottom: 20px;
            background: var(--accent-primary);
        }

        .article-title {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .article-meta {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .article-hero-img {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 40px;
            box-shadow: var(--shadow-sm);
        }

        .article-content {
            max-width: 800px;
            margin: 0 auto 60px;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .article-content p {
            margin-bottom: 25px;
        }

        .share-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin: 40px 0;
        }

        .btn-share {
            background-color: #1877F2; /* Facebook Blue */
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-share:hover { background-color: #0c5dc7; }

        /* FOOTER */
        footer {
            background-color: var(--text-main);
            color: white;
            padding: 60px 0 30px;
            margin-top: auto;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-col h3 { margin-bottom: 20px; color: var(--accent-primary); }
        .footer-col p { color: #a1b6d1; margin-bottom: 15px; }
        .footer-col a { color: #a1b6d1; display: block; margin-bottom: 10px; }
        .footer-col a:hover { color: white; padding-left: 5px; }
        
        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #a1b6d1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-wrapper { flex-direction: column; height: auto; padding: 15px 0; gap: 15px; }
            .main-nav { flex-wrap: wrap; justify-content: center; }
            .hero h1 { font-size: 2.2rem; }
            .article-title { font-size: 2rem; }
        }
    </style>
</head>

            // Re-render the current route to apply language changes to dynamic content
            app.classList.remove('animate-fade');
            void app.offsetWidth; // trigger reflow
            app.classList.add('animate-fade');
            
            router();
            updateStaticUI();
        }

        function t(key) {
            return i18n[currentLang][key] || i18n['en'][key] || key;
        }

        function getArticleContent(article) {
            // Fallback to English if translation for current language doesn't exist
            return article.translations[currentLang] || article.translations['en'];
        }

        function updateStaticUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t(key)) el.innerHTML = t(key);
            });
        }

        // --- ROUTER ---
        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => {
            document.getElementById('languageSelect').value = currentLang;
            router();
            updateStaticUI();
        });

        function router() {
            const hash = window.location.hash.slice(1) || '/';
            const parts = hash.split('/').filter(Boolean);
            
            // Scroll to top on route change
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (parts.length === 0) {
                renderHome();
            } else if (parts.length === 1) {
                renderSport(parts[0]);
            } else if (parts.length === 2) {
                renderArticle(parts[0], parts[1]);
            } else {
                renderHome(); // Fallback 404
            }
            updateStaticUI();
            observeScroll();
        }

        /* ==========================================================================
           4. PAGE RENDERERS
           ========================================================================== */
           
        function renderHome() {
            let html = `
                <section class="hero">
                    <div class="hero-content animate-slide delay-1">
                        <h1 data-i18n="hero_title">Всички спортове. Едно място.</h1>
                        <p data-i18n="hero_desc">Най-бързите и точни спортни новини от света на професионалния спорт.</p>
                    </div>
                </section>
                <div class="container">
                    <h2 class="section-title animate-slide delay-2" data-i18n="latest_news">Последни новини</h2>
                    <div class="grid">
            `;

            // Sort by date and display latest
            const latest = [...database].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            latest.forEach((article, index) => {
                const content = getArticleContent(article);
                const delay = index % 3 + 1;
                html += `
                    <a href="#/${article.sport}/${article.slug}" class="card animate-slide delay-${delay}">
                        <div class="card-img" style="background-image: url('${article.image}')">
                            <span class="sport-badge badge-${article.sport}" data-i18n="nav_${article.sport}">${t('nav_' + article.sport)}</span>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${content.title}</h3>
                            <p class="card-desc">${content.desc}</p>
                            <div class="card-meta">
                                <span>🗓 ${article.date}</span>
                                <span style="color: var(--accent-primary); font-weight:bold" data-i18n="read_more">${t('read_more')} →</span>
                            </div>
                        </div>
                    </a>
                `;
            });

            html += `</div></div>`;
            app.innerHTML = html;
        }

        function renderSport(sportName) {
            const sportArticles = database.filter(a => a.sport === sportName);
            const sportTitle = t('nav_' + sportName);
            
            let html = `
                <div class="hero" style="height: 30vh; min-height: 250px;">
                    <div class="hero-content animate-slide">
                        <h1 style="font-size: 3rem; text-transform: uppercase;">${sportTitle}</h1>
                    </div>
                </div>
                <div class="container">
                    <h2 class="section-title animate-slide" data-i18n="latest_news">${t('latest_news')}</h2>
                    <div class="grid">
            `;

            if (sportArticles.length === 0) {
                html += `<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-light);">Няма намерени статии за тази категория.</p>`;
            } else {
                sportArticles.forEach((article, index) => {
                    const content = getArticleContent(article);
                    html += `
                        <a href="#/${article.sport}/${article.slug}" class="card animate-slide delay-1">
                            <div class="card-img" style="background-image: url('${article.image}')"></div>
                            <div class="card-content">
                                <h3 class="card-title">${content.title}</h3>
                                <p class="card-desc">${content.desc}</p>
                                <div class="card-meta">
                                    <span>🗓 ${article.date}</span>
                                    <span style="color: var(--accent-primary); font-weight:bold" data-i18n="read_more">${t('read_more')} →</span>
                                </div>
                            </div>
                        </a>
                    `;
                });
            }

            html += `</div></div>`;
            app.innerHTML = html;
        }

        function renderArticle(sportName, slug) {
            const article = database.find(a => a.slug === slug && a.sport === sportName);
            if (!article) return renderHome();

            const content = getArticleContent(article);
            const shareUrl = encodeURIComponent(window.location.href);

            app.innerHTML = `
                <div class="container animate-slide">
                    <div class="article-header">
                        <a href="#/${article.sport}" class="article-sport-tag">
                            <span data-i18n="back_to_sport">${t('back_to_sport')}</span> ${t('nav_' + article.sport)}
                        </a>
                        <h1 class="article-title">${content.title}</h1>
                        <div class="article-meta">
                            <span data-i18n="author">${t('author')}</span> <strong>${article.author}</strong> &nbsp;|&nbsp; 🗓 ${article.date}
                        </div>
                    </div>
                    
                    <img src="${article.image}" alt="${content.title}" class="article-hero-img">
                    
                    <div class="article-content">
                        ${content.content}
                        
                        <div class="share-bar">
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="btn-share">
                                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.312h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
                                <span data-i18n="share_fb">${t('share_fb')}</span>
                            </a>
                        </div>
                    </div>
                    
                    <h2 class="section-title" data-i18n="related_articles">${t('related_articles')}</h2>
                    <div class="grid">
                        ${renderRelatedArticles(article.id, article.sport)}
                    </div>
                </div>
            `;
        }

        function renderRelatedArticles(currentId, sportName) {
            // Get up to 3 articles from the same sport or any sport, excluding current
            const related = database.filter(a => a.id !== currentId).slice(0, 3);
            let html = '';
            
            related.forEach(article => {
                const content = getArticleContent(article);
                html += `
                    <a href="#/${article.sport}/${article.slug}" class="card">
                        <div class="card-img" style="background-image: url('${article.image}'); height: 150px;">
                            <span class="sport-badge badge-${article.sport}" data-i18n="nav_${article.sport}">${t('nav_' + article.sport)}</span>
                        </div>
                        <div class="card-content" style="padding: 15px;">
                            <h3 class="card-title" style="font-size: 1.1rem;">${content.title}</h3>
                        </div>
                    </a>
                `;
            });
            return html;
        }

        /* ==========================================================================
           5. UTILITIES (Scroll Animations)
           ========================================================================== */
        function observeScroll() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-slide').forEach(el => {
                el.style.animationPlayState = 'paused';
                observer.observe(el);
            });
        }
    </script>
</body>
</html>
